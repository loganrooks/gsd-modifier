name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync Python test dependencies
        run: uv sync --frozen --only-dev

      - name: Run deterministic checks
        run: uv run bash scripts/ci/check-deterministic.sh

  bootstrap:
    runs-on: ubuntu-latest
    needs:
      - deterministic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync Python test dependencies
        run: uv sync --frozen --only-dev

      - name: Run bootstrap checks
        run: uv run bash scripts/ci/check-bootstrap.sh
